<!DOCTYPE html>                                                                               
   <html lang="ko">
   <head>
     <meta charset="UTF-8">
     <title>스튜디오 모멘텀으로 이동 중...</title>
     <script>
       // 기존 고객의 ref 토큰을 그대로 유지하여 새 주소로 0.01초 만에 자동 이동
       const search = window.location.search || '';
       const hash = window.location.hash || '';
       window.location.replace('https://studiomomentum.github.io/' + search + hash);
     </script>
   </head>
   <body style="background:#0f172a; color:#cbd5e1; text-align:center; padding-top:60px;">
     <p>스튜디오 모멘텀 공식 페이지로 이동 중입니다...</p>
   </body>
   </html>
